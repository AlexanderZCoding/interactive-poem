
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where the World Ends</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sky"></div>
    <div class="overlay"></div>

    <main class="poem-container">

        <p class="subtitle">A PLACE BETWEEN WORLDS</p>

        <h1>Where the World Ends</h1>

        <section class="poem" id="poem">

            <div class="line">
                <span>An</span>
                <span>empty</span>
                <span>road</span>
                <span>sleeps</span>
            </div>

            <div class="line">
                <span>Stars</span>
                <span>gather</span>
                <span>over</span>
                <span>nowhere</span>
            </div>

            <div class="line">
                <span>No</span>
                <span>one</span>
                <span>calls</span>
                <span>me</span>
                <span>home</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
